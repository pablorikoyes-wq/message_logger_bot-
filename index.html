        // ============================================================
        // ЗАГРУЗКА СООБЩЕНИЙ
        // ============================================================
        async function loadMessages(chatId) {
            const container = document.getElementById('messages-container');
            container.innerHTML = '<div style="text-align:center;padding:20px;color:#8b949e;">Загрузка...</div>';
            try {
                const requestData = { chat_id: chatId, init_data: initData };
                if (selectedAccountId && selectedAccountId !== 'default') {
                    requestData.account_id = selectedAccountId;
                }
                const response = await fetch(`${API_URL}/api/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                });
                const data = await response.json();
                if (data.error) {
                    container.innerHTML = `<div class="empty-state"><p class="error">❌ ${data.error}</p></div>`;
                    return;
                }
                if (!data.messages || data.messages.length === 0) {
                    container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><div class="title">Нет сообщений</div><p style="font-size:13px;">В этом чате пока нет сообщений</p></div>`;
                    return;
                }
                allMessages = data.messages;
                renderMessages(allMessages);
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><p class="error">❌ Ошибка загрузки: ${e.message}</p></div>`;
            }
        }

        // ============================================================
        // ОСНОВНАЯ ФУНКЦИЯ ОТОБРАЖЕНИЯ СООБЩЕНИЙ С МЕДИА
        // ============================================================
        function renderMessages(messages) {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            let lastSender = null;
            let msgGroup = [];

            messages.forEach((msg, index) => {
                const isMine = msg.from_user_name && msg.from_user_name.includes('⁠⁠⁠⁠');
                const sender = msg.from_user_name || 'Неизвестный';

                if (lastSender !== null && lastSender !== sender) {
                    flushGroup(container, msgGroup);
                    msgGroup = [];
                }

                msgGroup.push({ msg, isMine, sender });
                lastSender = sender;

                if (index === messages.length - 1) {
                    flushGroup(container, msgGroup);
                }
            });

            container.scrollTop = container.scrollHeight;
        }

        function flushGroup(container, group) {
            if (group.length === 0) return;

            const isMine = group[0].isMine;
            const sender = group[0].sender;
            const showName = !isMine;

            const wrapper = document.createElement('div');
            wrapper.style.cssText = 'display:flex;flex-direction:column;max-width:100%;';
            wrapper.className = `msg-wrapper ${isMine ? 'outgoing' : 'incoming'}`;

            if (showName) {
                const nameEl = document.createElement('div');
                nameEl.className = 'sender-name';
                nameEl.textContent = sender;
                wrapper.appendChild(nameEl);
            }

            group.forEach(({ msg }) => {
                const bubble = document.createElement('div');
                let classes = 'msg-bubble';

                const isDeleted = msg.is_deleted || false;
                const isEdited = msg.edited_at && msg.original_text && !isDeleted;

                if (isDeleted) {
                    classes += ' deleted-msg';
                    wrapper.classList.add('deleted');
                } else if (isEdited) {
                    classes += ' edited-msg';
                    wrapper.classList.add('edited');
                } else {
                    classes += ' normal-msg';
                }

                bubble.className = classes;

                let content = msg.text_content || '';
                const fileUrl = msg.file_url ? (msg.file_url.startsWith('http') ? msg.file_url : `${API_URL}${msg.file_url}`) : null;

                // ---- ФОТО ----
                if (msg.content_type === 'photo' && fileUrl) {
                    if (content) {
                        const textSpan = document.createElement('span');
                        textSpan.className = 'msg-text';
                        textSpan.textContent = content;
                        bubble.appendChild(textSpan);
                        bubble.appendChild(document.createElement('br'));
                    }
                    const img = document.createElement('img');
                    img.src = fileUrl;
                    img.alt = 'Фото';
                    img.loading = 'lazy';
                    img.style.maxWidth = '250px';
                    img.style.maxHeight = '250px';
                    img.style.borderRadius = '8px';
                    img.style.marginTop = '4px';
                    img.style.cursor = 'pointer';
                    img.style.objectFit = 'cover';
                    img.onclick = () => window.open(fileUrl, '_blank');
                    img.onerror = function() {
                        console.error('Ошибка загрузки фото:', fileUrl);
                        this.style.display = 'none';
                        const fallback = document.createElement('span');
                        fallback.textContent = '📷 Фото (не удалось загрузить)';
                        fallback.style.color = '#8b949e';
                        fallback.style.fontSize = '12px';
                        this.parentNode.appendChild(fallback);
                    };
                    bubble.appendChild(img);
                }
                // ---- GIF ----
                else if (msg.content_type === 'gif' && fileUrl) {
                    if (content) {
                        const textSpan = document.createElement('span');
                        textSpan.className = 'msg-text';
                        textSpan.textContent = content;
                        bubble.appendChild(textSpan);
                        bubble.appendChild(document.createElement('br'));
                    }
                    const video = document.createElement('video');
                    video.src = fileUrl;
                    video.autoplay = true;
                    video.loop = true;
                    video.muted = true;
                    video.playsInline = true;
                    video.controls = true;
                    video.style.maxWidth = '250px';
                    video.style.maxHeight = '250px';
                    video.style.borderRadius = '8px';
                    video.style.marginTop = '4px';
                    video.style.background = '#0a0e17';
                    video.onerror = function() {
                        console.error('Ошибка загрузки GIF:', fileUrl);
                        this.style.display = 'none';
                        const fallback = document.createElement('span');
                        fallback.textContent = '🎞️ GIF (не удалось загрузить)';
                        fallback.style.color = '#8b949e';
                        fallback.style.fontSize = '12px';
                        this.parentNode.appendChild(fallback);
                    };
                    bubble.appendChild(video);
                }
                // ---- ВИДЕО ----
                else if (msg.content_type === 'video' && fileUrl) {
                    if (content) {
                        const textSpan = document.createElement('span');
                        textSpan.className = 'msg-text';
                        textSpan.textContent = content;
                        bubble.appendChild(textSpan);
                        bubble.appendChild(document.createElement('br'));
                    }
                    const video = document.createElement('video');
                    video.src = fileUrl;
                    video.controls = true;
                    video.playsInline = true;
                    video.preload = 'metadata';
                    video.style.maxWidth = '250px';
                    video.style.maxHeight = '250px';
                    video.style.borderRadius = '8px';
                    video.style.marginTop = '4px';
                    video.style.background = '#0a0e17';
                    video.onerror = function() {
                        console.error('Ошибка загрузки видео:', fileUrl);
                        this.style.display = 'none';
                        const fallback = document.createElement('span');
                        fallback.textContent = '🎥 Видео (не удалось загрузить)';
                        fallback.style.color = '#8b949e';
                        fallback.style.fontSize = '12px';
                        this.parentNode.appendChild(fallback);
                    };
                    bubble.appendChild(video);
                }
                // ---- СТИКЕРЫ ----
                else if (msg.content_type === 'sticker' && fileUrl) {
                    const img = document.createElement('img');
                    img.src = fileUrl;
                    img.alt = 'Стикер';
                    img.loading = 'lazy';
                    img.style.maxWidth = '160px';
                    img.style.maxHeight = '160px';
                    img.style.borderRadius = '8px';
                    img.style.marginTop = '4px';
                    img.onerror = function() {
                        console.error('Ошибка загрузки стикера:', fileUrl);
                        this.style.display = 'none';
                        const fallback = document.createElement('span');
                        fallback.textContent = '🖼️ Стикер (не удалось загрузить)';
                        fallback.style.color = '#8b949e';
                        fallback.style.fontSize = '12px';
                        this.parentNode.appendChild(fallback);
                    };
                    bubble.appendChild(img);
                    if (content) {
                        const textSpan = document.createElement('span');
                        textSpan.className = 'msg-text';
                        textSpan.textContent = ' ' + content;
                        bubble.appendChild(textSpan);
                    }
                }
                // ---- ГОЛОСОВЫЕ И АУДИО ----
                else if ((msg.content_type === 'voice' || msg.content_type === 'audio') && fileUrl) {
                    if (content) {
                        const textSpan = document.createElement('span');
                        textSpan.className = 'msg-text';
                        textSpan.textContent = content;
                        bubble.appendChild(textSpan);
                        bubble.appendChild(document.createElement('br'));
                    }
                    const audio = document.createElement('audio');
                    audio.src = fileUrl;
                    audio.controls = true;
                    audio.preload = 'metadata';
                    audio.style.width = '100%';
                    audio.style.maxWidth = '220px';
                    audio.style.marginTop = '4px';
                    audio.onerror = function() {
                        console.error('Ошибка загрузки аудио:', fileUrl);
                        this.style.display = 'none';
                        const fallback = document.createElement('span');
                        fallback.textContent = '🎵 Аудио (не удалось загрузить)';
                        fallback.style.color = '#8b949e';
                        fallback.style.fontSize = '12px';
                        this.parentNode.appendChild(fallback);
                    };
                    bubble.appendChild(audio);
                }
                // ---- ДОКУМЕНТЫ ----
                else if (msg.content_type === 'document' && fileUrl) {
                    if (content) {
                        const textSpan = document.createElement('span');
                        textSpan.className = 'msg-text';
                        textSpan.textContent = content + ' ';
                        bubble.appendChild(textSpan);
                    }
                    const fileName = fileUrl.split('/').pop() || 'документ';
                    const link = document.createElement('a');
                    link.href = fileUrl;
                    link.target = '_blank';
                    link.textContent = `📄 ${fileName}`;
                    link.className = 'file-link';
                    link.style.display = 'inline-block';
                    link.style.marginTop = '4px';
                    link.style.wordBreak = 'break-all';
                    bubble.appendChild(link);
                }
                // ---- ОБЫЧНЫЙ ТЕКСТ ----
                else {
                    const labels = {
                        'photo': '📷 Фото',
                        'video': '🎥 Видео',
                        'voice': '🎤 Голосовое',
                        'audio': '🎵 Аудио',
                        'gif': '🎞️ GIF',
                        'sticker': '🖼️ Стикер',
                        'document': '📄 Файл'
                    };
                    if (msg.content_type && msg.content_type !== 'text' && labels[msg.content_type]) {
                        content = labels[msg.content_type] + (content ? ': ' + content : '');
                    }
                    const textSpan = document.createElement('span');
                    textSpan.className = 'msg-text';
                    textSpan.textContent = content || '(без текста)';
                    bubble.appendChild(textSpan);
                }

                if (isDeleted) {
                    const deleteIcon = document.createElement('span');
                    deleteIcon.className = 'delete-icon';
                    deleteIcon.textContent = ' 🗑️';
                    bubble.appendChild(deleteIcon);
                }

                const timeEl = document.createElement('div');
                timeEl.className = 'msg-time';
                const timeStr = msg.sent_at ? new Date(msg.sent_at).toLocaleString('ru-RU') : '';
                let timeHtml = timeStr;
                if (isDeleted && msg.deleted_at) {
                    timeHtml += ` | 🗑️ <span style="color:#f85149;">Удалено ${new Date(msg.deleted_at).toLocaleString('ru-RU')}</span>`;
                }
                timeEl.innerHTML = timeHtml;

                wrapper.appendChild(bubble);
                wrapper.appendChild(timeEl);

                if (isEdited && msg.original_text) {
                    const editBlock = document.createElement('div');
                    editBlock.className = 'edit-block';
                    const oldText = document.createElement('div');
                    oldText.className = 'old-text';
                    oldText.textContent = msg.original_text || '(оригинал)';
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow-down';
                    arrow.textContent = '⬇️';
                    const newText = document.createElement('div');
                    newText.className = 'new-text';
                    newText.textContent = content || msg.text_content || '(без текста)';
                    editBlock.appendChild(oldText);
                    editBlock.appendChild(arrow);
                    editBlock.appendChild(newText);
                    wrapper.appendChild(editBlock);
                }
            });

            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        // ============================================================
        // ВКЛАДКИ
        // ============================================================
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            const logsList = document.getElementById('logs-list');
            const connectionsList = document.getElementById('connections-list');
            const chatsList = document.getElementById('chats-list');
            const messagesView = document.getElementById('messages-view');
            const accountsView = document.getElementById('accounts-view');
            const accountChatsView = document.getElementById('account-chats-view');
            const profileView = document.getElementById('profile-view');
            const trashBanner = document.getElementById('trash-banner');
            const filters = document.getElementById('filters');

            logsList.style.display = 'none';
            connectionsList.style.display = 'none';
            chatsList.style.display = 'none';
            messagesView.classList.remove('visible');
            accountsView.style.display = 'none';
            accountChatsView.style.display = 'none';
            profileView.style.display = 'none';
            trashBanner.style.display = 'none';
            filters.style.display = 'none';

            if (tab === 'logs') {
                document.getElementById('tab-logs').classList.add('active');
                document.getElementById('header-title').textContent = '📋 Логи сообщений';
                logsList.style.display = 'block';
                filters.style.display = 'flex';
                loadAllLogs();
            } else if (tab === 'chats') {
                document.getElementById('tab-chats').classList.add('active');
                document.getElementById('header-title').textContent = '💬 Чаты';
                chatsList.style.display = 'block';
                if (trashMode) trashBanner.style.display = 'flex';
                loadChats();
            } else if (tab === 'connections') {
                document.getElementById('tab-connections').classList.add('active');
                document.getElementById('header-title').textContent = '🔌 Подключения';
                connectionsList.style.display = 'block';
                loadConnectionLogs();
            } else if (tab === 'accounts') {
                document.getElementById('tab-accounts').classList.add('active');
                document.getElementById('header-title').textContent = '🔗 Аккаунты';
                accountsView.style.display = 'block';
                loadAccounts();
            } else if (tab === 'profile') {
                document.getElementById('tab-profile').classList.add('active');
                document.getElementById('header-title').textContent = '👤 Профиль';
                profileView.style.display = 'block';
                updateProfile();
            }
        }

        function logoutFromApp() {
            if (tg) tg.close();
            else {
                document.getElementById('main-screen').classList.add('hidden');
                document.getElementById('password-screen').style.display = 'flex';
                document.getElementById('password-input').value = '';
            }
        }

        if (tg) { tg.ready(); tg.expand(); }
        document.getElementById('password-screen').style.display = 'flex';
        document.getElementById('main-screen').classList.add('hidden');
    </script>

</body>
</html>
