<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Переписки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #e6edf3;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            overflow: hidden;
            position: relative;
        }
        .waves {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .wave {
            position: absolute;
            bottom: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(ellipse at 50% 100%, rgba(88, 101, 242, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            animation: waveMove 8s ease-in-out infinite alternate;
        }
        .wave:nth-child(2) {
            background: radial-gradient(ellipse at 30% 100%, rgba(88, 101, 242, 0.05) 0%, transparent 60%);
            animation-delay: -3s;
            animation-duration: 10s;
        }
        .wave:nth-child(3) {
            background: radial-gradient(ellipse at 70% 100%, rgba(88, 101, 242, 0.06) 0%, transparent 50%);
            animation-delay: -6s;
            animation-duration: 12s;
        }
        @keyframes waveMove {
            0% { transform: translateX(0) scale(1); }
            100% { transform: translateX(5%) scale(1.05); }
        }
        .content {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 500px;
            margin: 0 auto;
            background: rgba(13, 17, 23, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .password-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        .password-screen .lock-icon { font-size: 56px; margin-bottom: 16px; animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .password-screen h2 { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #f0f6fc, #8b949e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .password-screen .sub { color: #8b949e; margin-top: 6px; font-size: 14px; }
        .password-screen input {
            width: 100%; max-width: 280px; padding: 12px 16px; font-size: 18px;
            background: rgba(26, 26, 46, 0.8); border: 2px solid rgba(88, 101, 242, 0.3);
            border-radius: 12px; color: #f0f6fc; text-align: center; letter-spacing: 6px;
            margin-top: 20px; outline: none; transition: all 0.3s;
        }
        .password-screen input:focus { border-color: #5865f2; box-shadow: 0 0 20px rgba(88, 101, 242, 0.2); }
        .password-screen .btn-primary {
            margin-top: 14px; padding: 12px 40px; background: linear-gradient(135deg, #5865f2, #4752c4);
            color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: all 0.3s; width: 100%; max-width: 280px;
        }
        .password-screen .btn-primary:hover { transform: scale(1.02); box-shadow: 0 4px 20px rgba(88, 101, 242, 0.3); }
        .password-screen .btn-secondary {
            margin-top: 10px; padding: 10px 30px; background: rgba(255, 255, 255, 0.05);
            color: #8b949e; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.3s;
            width: 100%; max-width: 280px;
        }
        .password-screen .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); color: #f0f6fc; }
        .password-screen .error { color: #f85149; margin-top: 10px; font-size: 14px; min-height: 24px; }
        .hidden { display: none !important; }

        .app-container { flex: 1; display: flex; flex-direction: column; min-height: 0; height: 100vh; }
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: rgba(22, 27, 34, 0.8);
            border-bottom: 1px solid rgba(33, 38, 45, 0.5); flex-shrink: 0;
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        .header h1 { font-size: 17px; font-weight: 700; background: linear-gradient(135deg, #f0f6fc, #8b949e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header .badge { background: linear-gradient(135deg, #5865f2, #4752c4); color: white; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .header .header-actions { display: flex; gap: 10px; align-items: center; }
        .header .header-actions button { background: none; border: none; color: #8b949e; font-size: 18px; cursor: pointer; padding: 4px; transition: all 0.3s; }
        .header .header-actions button:hover { color: #f0f6fc; }
        .header .header-actions .active-btn { color: #5865f2; }
        .back-btn { display: inline-flex; align-items: center; gap: 4px; background: none; border: none; color: #5865f2; font-size: 14px; font-weight: 600; cursor: pointer; padding: 4px 0; }

        .filters {
            display: flex;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(22, 27, 34, 0.6);
            border-bottom: 1px solid rgba(33, 38, 45, 0.3);
            flex-shrink: 0;
            overflow-x: auto;
            flex-wrap: wrap;
            z-index: 10;
        }
        .filter-btn {
            padding: 4px 14px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid rgba(48, 54, 61, 0.5);
            background: transparent;
            color: #8b949e;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .filter-btn.active {
            background: rgba(88, 101, 242, 0.2);
            border-color: #5865f2;
            color: #5865f2;
        }
        .filter-btn:hover { background: rgba(48, 54, 61, 0.4); }
        .filter-btn.all.active { background: rgba(88, 101, 242, 0.2); border-color: #5865f2; color: #5865f2; }
        .filter-btn.normal.active { background: rgba(63, 185, 80, 0.2); border-color: #3fb950; color: #3fb950; }
        .filter-btn.edited.active { background: rgba(210, 153, 34, 0.2); border-color: #d29922; color: #d29922; }
        .filter-btn.deleted.active { background: rgba(248, 81, 73, 0.2); border-color: #f85149; color: #f85149; }

        .logs-list { flex: 1; overflow-y: auto; padding: 8px 0; min-height: 0; }
        .log-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid rgba(22, 27, 34, 0.5);
            gap: 10px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 0;
        }
        .log-item:hover { background: rgba(22, 27, 34, 0.4); }
        .log-item .log-time { color: #8b949e; font-size: 11px; flex-shrink: 0; min-width: 70px; }
        .log-item .log-sender { color: #8b949e; font-size: 12px; flex-shrink: 0; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .log-item .log-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px; }
        .log-item .log-icon { font-size: 14px; flex-shrink: 0; margin-left: auto; }
        .log-item .log-icon.edited-icon { color: #d29922; }
        .log-item .log-icon.deleted-icon { color: #f85149; }
        .log-item.normal { border-left: 3px solid #3fb950; background: rgba(63, 185, 80, 0.05); }
        .log-item.edited { border-left: 3px solid #d29922; background: rgba(210, 153, 34, 0.08); }
        .log-item.deleted { border-left: 3px solid #f85149; background: rgba(248, 81, 73, 0.08); }

        .connections-list { flex: 1; overflow-y: auto; padding: 8px 0; min-height: 0; }
        .conn-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid rgba(22, 27, 34, 0.5);
            gap: 10px;
            font-size: 13px;
            border-radius: 0;
        }
        .conn-item .conn-time { color: #8b949e; font-size: 11px; flex-shrink: 0; min-width: 70px; }
        .conn-item .conn-user { color: #f0f6fc; font-size: 12px; flex-shrink: 0; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .conn-item .conn-action { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px; font-weight: 500; }
        .conn-item .conn-action.connect { color: #3fb950; }
        .conn-item .conn-action.disconnect { color: #f85149; }
        .conn-item .conn-chats { font-size: 11px; color: #8b949e; flex-shrink: 0; }
        .conn-item.connect { border-left: 3px solid #3fb950; background: rgba(63, 185, 80, 0.05); }
        .conn-item.disconnect { border-left: 3px solid #f85149; background: rgba(248, 81, 73, 0.05); }

        .chats-list { flex: 1; overflow-y: auto; padding: 8px 0; min-height: 0; }
        .chat-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid rgba(22, 27, 34, 0.5);
            gap: 14px;
            position: relative;
            user-select: none;
            border-radius: 0;
        }
        .chat-item:hover { background: rgba(22, 27, 34, 0.5); }
        .chat-item.pinned { border-left: 3px solid #5865f2; background: rgba(88, 101, 242, 0.05); }
        .chat-item .avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #5865f2, #4752c4);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 700; color: white; flex-shrink: 0; text-transform: uppercase;
        }
        .chat-item .info { flex: 1; min-width: 0; }
        .chat-item .info .name { font-weight: 600; font-size: 15px; color: #f0f6fc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-item .info .last-msg { font-size: 13px; color: #8b949e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .chat-item .time { font-size: 11px; color: #8b949e; flex-shrink: 0; margin-left: 6px; }
        .chat-item .stats-badge { display: flex; gap: 6px; font-size: 10px; color: #8b949e; margin-top: 2px; }
        .chat-item .stats-badge .deleted-count { color: #f85149; }
        .chat-item .stats-badge .edited-count { color: #d29922; }
        .chat-item .checkbox {
            width: 20px; height: 20px; border: 2px solid #30363d; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            cursor: pointer; transition: all 0.2s; background: transparent;
        }
        .chat-item .checkbox.checked { background: #5865f2; border-color: #5865f2; }
        .chat-item .checkbox.checked::after { content: '✓'; color: white; font-size: 12px; }

        .context-menu {
            position: fixed;
            background: rgba(30, 35, 42, 0.95);
            border-radius: 12px;
            padding: 8px;
            min-width: 180px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(48, 54, 61, 0.5);
            display: none;
        }
        .context-menu button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 14px;
            background: none;
            border: none;
            color: #e6edf3;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .context-menu button:hover { background: rgba(48, 54, 61, 0.5); }
        .context-menu .danger { color: #f85149; }
        .context-menu .success { color: #3fb950; }

        .accounts-list { flex: 1; overflow-y: auto; padding: 8px 0; min-height: 0; }
        .account-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid rgba(22, 27, 34, 0.5);
            gap: 14px;
        }
        .account-item:hover { background: rgba(22, 27, 34, 0.5); }
        .account-item .account-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #2b5278, #1a3a5a);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 700; color: white; flex-shrink: 0;
        }
        .account-item .account-info { flex: 1; }
        .account-item .account-info .account-name { font-weight: 600; font-size: 15px; color: #f0f6fc; }
        .account-item .account-info .account-id { font-size: 12px; color: #8b949e; }
        .account-item .account-info .account-user { font-size: 12px; color: #8b949e; }
        .account-item .account-status {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 20px;
        }
        .account-item .account-status.online { background: rgba(46, 160, 67, 0.2); color: #3fb950; }
        .account-item .account-status.offline { background: rgba(248, 81, 73, 0.2); color: #f85149; }
        .account-item .account-chats-count {
            font-size: 11px;
            color: #8b949e;
            margin-top: 2px;
        }

        .profile-section { flex: 1; overflow-y: auto; padding: 16px; min-height: 0; }
        .profile-section .info-card {
            background: rgba(22, 27, 34, 0.8);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(48, 54, 61, 0.5);
        }
        .profile-section .info-card .label { color: #8b949e; font-size: 13px; }
        .profile-section .info-card .value { color: #f0f6fc; font-size: 16px; font-weight: 600; margin-top: 4px; }
        .profile-section .info-card .value.admin-badge { color: #5865f2; font-size: 13px; }
        .profile-section .info-card .value.owner-badge { color: #d29922; font-size: 13px; }
        .profile-btn {
            display: flex; align-items: center; gap: 12px; padding: 14px 16px;
            background: rgba(22, 27, 34, 0.8); border: 1px solid rgba(48, 54, 61, 0.5);
            border-radius: 12px; color: #f0f6fc; cursor: pointer; transition: all 0.2s;
            width: 100%; text-align: left; font-size: 15px; margin-bottom: 8px;
        }
        .profile-btn:hover { background: rgba(48, 54, 61, 0.5); border-color: #5865f2; }
        .profile-btn .icon { font-size: 20px; }
        .profile-btn .admin-badge { color: #5865f2; font-size: 12px; margin-left: auto; }

        .admin-input-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .admin-input-group input {
            flex: 1;
            padding: 8px 12px;
            background: rgba(26, 26, 46, 0.8);
            border: 1px solid rgba(48, 54, 61, 0.5);
            border-radius: 8px;
            color: #f0f6fc;
            font-size: 14px;
            outline: none;
        }
        .admin-input-group input:focus { border-color: #5865f2; }
        .admin-input-group button {
            padding: 8px 16px;
            background: #5865f2;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .admin-input-group button:hover { background: #4752c4; }
        .admin-input-group button:disabled {
            background: #30363d;
            cursor: not-allowed;
        }
        .admin-list {
            margin-top: 8px;
            max-height: 150px;
            overflow-y: auto;
        }
        .admin-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(22, 27, 34, 0.5);
            border-radius: 8px;
            margin-bottom: 4px;
        }
        .admin-item .admin-name { font-size: 14px; color: #f0f6fc; }
        .admin-item .admin-id { font-size: 12px; color: #8b949e; }
        .admin-item .admin-owner-badge { font-size: 11px; color: #d29922; margin-left: 6px; }
        .admin-item .remove-admin {
            background: none;
            border: none;
            color: #f85149;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
        }
        .admin-item .remove-admin:hover { color: #ff6b6b; }
        .admin-item .remove-admin:disabled {
            color: #30363d;
            cursor: not-allowed;
        }

        .bottom-nav {
            display: flex;
            padding: 8px 16px 12px;
            background: rgba(22, 27, 34, 0.9);
            border-top: 1px solid rgba(33, 38, 45, 0.5);
            gap: 8px;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        .bottom-nav .nav-btn {
            flex: 1;
            padding: 8px;
            text-align: center;
            border-radius: 10px;
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .bottom-nav .nav-btn.active { color: #5865f2; }
        .bottom-nav .nav-btn.active::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 2px;
            background: #5865f2;
            border-radius: 2px;
        }
        .bottom-nav .nav-btn:hover { color: #f0f6fc; }
        .bottom-nav .nav-btn .nav-icon { font-size: 22px; display: block; margin-bottom: 2px; }

        .messages-view {
            flex: 1;
            display: none;
            flex-direction: column;
            min-height: 0;
            height: 100%;
        }
        .messages-view.visible { display: flex; }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-height: 0;
            height: 100%;
        }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 100%; }
        .msg-wrapper .sender-name { font-size: 11px; color: #8b949e; margin-bottom: 1px; padding-left: 10px; }
        .msg-bubble { padding: 6px 12px; border-radius: 10px; max-width: 85%; word-wrap: break-word; position: relative; font-size: 13px; line-height: 1.4; }
        .msg-wrapper.outgoing { align-self: flex-end; }
        .msg-wrapper.outgoing .msg-bubble { background: #2b5278; color: white; border-bottom-right-radius: 3px; }
        .msg-wrapper.incoming { align-self: flex-start; }
        .msg-wrapper.incoming .msg-bubble { background: rgba(24, 37, 51, 0.8); color: #e6edf3; border-bottom-left-radius: 3px; }
        
        .msg-wrapper .msg-bubble.normal-msg { border-left: 4px solid #3fb950; }
        .msg-wrapper .msg-bubble.edited-msg { border-left: 4px solid #d29922; background: rgba(210, 153, 34, 0.15) !important; }
        .msg-wrapper .msg-bubble.deleted-msg { border-left: 4px solid #f85149; background: rgba(248, 81, 73, 0.15) !important; color: rgba(255, 255, 255, 0.6) !important; text-decoration: line-through; }

        .msg-wrapper.deleted .delete-icon { margin-left: 4px; font-size: 12px; color: #f85149; }
        .msg-wrapper.edited .edit-block { margin-top: 3px; padding: 4px 8px; background: rgba(22, 27, 34, 0.8); border-radius: 6px; border-left: 2px solid #d29922; font-size: 11px; max-width: 85%; }
        .msg-time { font-size: 10px; color: #8b949e; margin-top: 1px; padding: 0 4px; }

        .msg-bubble img, .msg-bubble video {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 4px;
            display: block;
        }
        .msg-bubble img {
            max-height: 300px;
            object-fit: cover;
            cursor: pointer;
        }
        .msg-bubble video {
            max-height: 300px;
            background: #0a0e17;
        }
        .msg-bubble audio {
            width: 100%;
            max-width: 220px;
            margin-top: 4px;
        }
        .msg-bubble .file-link {
            color: #5865f2;
            text-decoration: underline;
            display: inline-block;
            margin-top: 4px;
            word-break: break-all;
        }

        .empty-state { text-align: center; padding: 40px 20px; color: #8b949e; }
        .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
        .empty-state .title { font-size: 16px; font-weight: 600; color: #f0f6fc; margin-bottom: 4px; }
        .empty-state .error { color: #f85149; }

        .trash-banner {
            background: rgba(26, 16, 18, 0.9);
            padding: 8px 16px;
            display: none;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(42, 26, 26, 0.5);
            flex-shrink: 0;
            z-index: 10;
        }
        .trash-banner.visible { display: flex; }
        .trash-banner span { color: #f85149; font-weight: 600; font-size: 13px; }
        .trash-banner .trash-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .trash-banner button {
            background: none;
            border: none;
            color: #8b949e;
            cursor: pointer;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .trash-banner button:hover { background: rgba(48, 54, 61, 0.5); color: #f0f6fc; }
        .trash-banner .btn-clear-all { color: #f85149 !important; }
        .trash-banner .btn-clear-all:hover { background: rgba(248, 81, 73, 0.15) !important; color: #ff6b6b !important; }
        .trash-banner .btn-select-mode { color: #5865f2 !important; }
        .trash-banner .btn-select-mode:hover { background: rgba(88, 101, 242, 0.15) !important; color: #7b88ff !important; }
        .trash-banner .btn-select-mode.active { color: #f0f6fc !important; background: rgba(88, 101, 242, 0.2) !important; }
        .trash-banner .btn-delete-selected { color: #f85149 !important; }
        .trash-banner .btn-delete-selected:hover { background: rgba(248, 81, 73, 0.15) !important; }

        .warning-banner {
            background: rgba(248, 81, 73, 0.15);
            border-left: 4px solid #f85149;
            padding: 10px 16px;
            display: none;

            gap: 10px;
            flex-shrink: 0;

            color: #f85149;

        .warning-banner .close-warning {
            background: none;
            border: none;
            color: #f85149;
            cursor: pointer;
            font-size: 16px;
            margin-left: auto;

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #484f58; }

        @media (max-width: 480px) {
            .chat-item { padding: 12px 14px; }
            .chat-item .avatar { width: 40px; height: 40px; font-size: 15px; }
            .chat-item .info .name { font-size: 14px; }
            .chat-item .info .last-msg { font-size: 12px; }
            .header { padding: 10px 12px; }
            .header h1 { font-size: 15px; }
            .log-item .log-sender { max-width: 60px; }
            .log-item .log-time { min-width: 55px; font-size: 10px; }
            .conn-item .conn-user { max-width: 60px; }
            .conn-item .conn-time { min-width: 55px; font-size: 10px; }
            .filters { gap: 4px; padding: 6px 10px; }
            .filter-btn { font-size: 10px; padding: 2px 10px; }
            .bottom-nav .nav-btn { font-size: 10px; }
            .bottom-nav .nav-btn .nav-icon { font-size: 16px; }
            .msg-bubble img, .msg-bubble video {
                max-height: 200px;

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }

<body>

    <div class="waves">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <div id="password-screen" class="content password-screen" style="display:flex;">
        <div class="lock-icon">🔐</div>
        <h2>Введите пароль</h2>
        <p class="sub">Для доступа к перепискам</p>
        <input type="password" id="password-input" placeholder="Введите пароль" maxlength="20" />
        <button class="btn-primary" onclick="login()">Войти</button>
        <button class="btn-secondary" onclick="recoverPassword()">🔑 Восстановить пароль</button>
        <div id="login-error" class="error"></div>
    </div>

    <div id="main-screen" class="content hidden">
        <div class="app-container">
            <div class="header">
                <h1 id="header-title">📋 Логи</h1>
                <div class="header-actions">
                    <button onclick="toggleTrashMode()" id="trash-btn" title="Корзина">🗑️</button>
                    <button onclick="refreshAll()" title="Обновить" style="background:none;border:none;color:#8b949e;font-size:18px;cursor:pointer;">🔄</button>
                    <span class="badge" id="chats-count">0</span>
                </div>
            </div>

            <div class="warning-banner" id="warning-banner">
                <span>⚠️</span>
                <span id="warning-text">Было обнаружено отключение бота! Возможна потеря сообщений.</span>
                <button class="close-warning" onclick="closeWarning()">✕</button>
            </div>

            <div class="filters" id="filters" style="display:flex;">
                <button class="filter-btn all active" data-filter="all" onclick="setLogFilter('all')">📋 Все</button>
                <button class="filter-btn normal active" data-filter="normal" onclick="setLogFilter('normal')">💬 Обычные</button>
                <button class="filter-btn edited active" data-filter="edited" onclick="setLogFilter('edited')">✏️ Ред.</button>
                <button class="filter-btn deleted active" data-filter="deleted" onclick="setLogFilter('deleted')">🗑️ Удал.</button>
            </div>

            <div id="logs-list" class="logs-list"></div>
            <div id="connections-list" class="connections-list" style="display:none;"></div>
            <div id="chats-list" class="chats-list" style="display:none;"></div>

            <div id="messages-view" class="messages-view">
                <div class="header" style="border-bottom: none; padding: 8px 16px;">
                    <button class="back-btn" onclick="backToChats()">← Назад</button>
                    <h1 id="chat-title" style="font-size:15px;">Чат</h1>
                    <span style="width:40px;"></span>
                </div>
                <div id="messages-container" class="messages-container"></div>
            </div>

            <div id="accounts-view" class="accounts-list" style="display:none;"></div>
            <div id="account-chats-view" class="chats-list" style="display:none;"></div>

            <div id="profile-view" class="profile-section" style="display:none;">
                <div class="info-card">
                    <div class="label">Ваш ID</div>
                    <div class="value" id="profile-user-id">Загрузка...</div>
                </div>
                <div class="info-card">
                    <div class="label">Статус</div>
                    <div class="value" id="profile-status">Пользователь</div>
                </div>
                <button class="profile-btn" onclick="refreshAdminStatus()" style="margin-bottom:8px;">
                    <span class="icon">🔄</span>
                    <span>Обновить статус</span>
                </button>
                <div class="info-card" id="admin-section" style="display:none;">
                    <div class="label">👑 Администраторы</div>
                    <div class="admin-list" id="admin-list"></div>
                    <div class="admin-input-group" id="admin-input-group">
                        <input type="number" id="admin-id-input" placeholder="Введите ID пользователя" />
                        <button id="add-admin-btn" onclick="addAdmin()">➕ Добавить</button>
                    </div>
                </div>
                <button class="profile-btn" onclick="logoutFromApp()">
                    <span class="icon">🚪</span>
                    <span>Выйти</span>
                </button>
            </div>

            <div id="trash-banner" class="trash-banner">
                <span>🗑️ Корзина</span>
                <div class="trash-actions">
                    <button class="btn-select-mode" id="select-mode-btn" onclick="toggleSelectMode()">☐ Выбрать</button>
                    <button class="btn-delete-selected" id="delete-selected-btn" onclick="deleteSelectedFromTrash()" style="display:none;">🗑️ Удалить</button>
                    <button class="btn-clear-all" onclick="clearAllTrash()">🧹 Очистить</button>
                    <button class="btn-exit-trash" onclick="toggleTrashMode()">✕</button>
                </div>
            </div>

            <div class="bottom-nav">
                <button class="nav-btn active" onclick="switchTab('logs')" id="tab-logs">
                    <span class="nav-icon">📋</span> Логи
                </button>
                <button class="nav-btn" onclick="switchTab('chats')" id="tab-chats">
                    <span class="nav-icon">💬</span> Чаты
                </button>
                <button class="nav-btn" onclick="switchTab('connections')" id="tab-connections">
                    <span class="nav-icon">🔌</span> Подключения
                </button>
                <button class="nav-btn" onclick="switchTab('accounts')" id="tab-accounts">
                    <span class="nav-icon">🔗</span> Аккаунты
                </button>
                <button class="nav-btn" onclick="switchTab('profile')" id="tab-profile">
                    <span class="nav-icon">👤</span> Профиль
                </button>
            </div>

        </div>
    </div>

    <div class="context-menu" id="context-menu">
        <button onclick="pinChat()" id="pin-btn">📌 Закрепить</button>
        <button onclick="unpinChat()" id="unpin-btn" style="display:none;">📌 Открепить</button>
        <button onclick="moveToTrash()" class="danger">🗑️ Удалить</button>
    </div>

    <script>
        // ============================================================
        // КОНФИГ
        // ============================================================
        const API_URL = 'http://107.189.21.103:8080';
        const APP_PASSWORD = '166734';
        const OWNER_IDS = [5709389268, 8038746319];

        let tg = null;
        let initData = '';
        let userId = null;
        let currentTab = 'logs';
        let selectedAccountId = null;
        let allChats = [];
        let allLogs = [];
        let filteredLogs = [];
        let allMessages = [];
        let currentChatId = null;
        let accountsData = [];
        let pinnedChats = new Set();
        let trashChats = new Set();
        let selectedChats = new Set();
        let selectMode = false;
        let trashMode = false;
        let contextChatId = null;
        let connectionLogs = [];
        let filteredConnectionLogs = [];
        let isAdmin = false;
        let isOwner = false;
        let admins = [];
        let accountChats = [];
        let selectedAccountInfo = null;
        
        let logFilters = { all: true, normal: true, edited: true, deleted: true };

        try { tg = window.Telegram?.WebApp; } catch (e) {}

        // ============================================================
        // АВТОРИЗАЦИЯ
        // ============================================================
        function login() {
            const input = document.getElementById('password-input');
            const error = document.getElementById('login-error');
            const password = input.value.trim();
            if (password === APP_PASSWORD) {
                error.textContent = '';
                document.getElementById('password-screen').style.display = 'none';
                document.getElementById('main-screen').classList.remove('hidden');
                initApp();
            } else {
                error.textContent = '❌ Неверный пароль';
                input.value = '';
                input.focus();
            }
        }

        document.getElementById('password-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });

        function recoverPassword() {
            if (tg) {
                tg.showAlert('🔑 Восстановление пароля доступно только владельцу.');
            } else {
                alert('🔑 Восстановление пароля доступно только владельцу.');
            }
        }

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        async function initApp() {
            if (!tg || !tg.initData) {
                document.querySelector('#password-screen .sub').textContent = 'Открой через Telegram';
                document.getElementById('password-screen').style.display = 'flex';
                document.getElementById('main-screen').classList.add('hidden');
                return;
            }
            tg.ready();
            tg.expand();
            initData = tg.initData;

            try {
                const params = new URLSearchParams(initData);
                const userStr = params.get('user');
                if (userStr) {
                    const user = JSON.parse(decodeURIComponent(userStr));
                    userId = user.id;
                }
            } catch (e) {
                console.error('Ошибка парсинга user:', e);
            }

            document.getElementById('profile-user-id').textContent = userId || 'Неизвестно';

            loadPinnedChats();
            loadTrashChats();

            try {
                const saved = localStorage.getItem('selected_account');
                if (saved) selectedAccountId = saved;
            } catch (e) {}

            await loadAdminsFromServer();
            await loadAccounts();
            await loadConnectionLogs();
            await loadAllLogs();
            await loadChats();
            checkWarnings();
            updateProfile();
        }

        function loadPinnedChats() {
            try { const saved = localStorage.getItem('pinned_chats'); if (saved) pinnedChats = new Set(JSON.parse(saved)); } catch (e) {}
        }
        function savePinnedChats() {
            try { localStorage.setItem('pinned_chats', JSON.stringify(Array.from(pinnedChats))); } catch (e) {}
        }
        function loadTrashChats() {
            try { const saved = localStorage.getItem('trash_chats'); if (saved) trashChats = new Set(JSON.parse(saved)); } catch (e) {}
        }
        function saveTrashChats() {
            try { localStorage.setItem('trash_chats', JSON.stringify(Array.from(trashChats))); } catch (e) {}
        }

        // ============================================================
        // ЗАГРУЗКА АДМИНОВ С СЕРВЕРА
        // ============================================================
        async function loadAdminsFromServer() {
            try {
                const response = await fetch(`${API_URL}/api/get_admins`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ init_data: initData })
                });
                const data = await response.json();
                if (data.admins) {
                    admins = data.admins;
                    isAdmin = admins.includes(Number(userId));
                    isOwner = OWNER_IDS.includes(Number(userId));
                    localStorage.setItem('admins', JSON.stringify(admins));
                } else {
                    const saved = localStorage.getItem('admins');
                    if (saved) {
                        admins = JSON.parse(saved);
                    } else {
                        admins = [...OWNER_IDS];
                    }
                    isAdmin = admins.includes(Number(userId));
                    isOwner = OWNER_IDS.includes(Number(userId));
                }
            } catch (e) {
                console.error('Ошибка загрузки админов:', e);
                const saved = localStorage.getItem('admins');
                if (saved) {
                    admins = JSON.parse(saved);
                } else {
                    admins = [...OWNER_IDS];
                }
                isAdmin = admins.includes(Number(userId));
                isOwner = OWNER_IDS.includes(Number(userId));
            }
            updateProfile();
        }

        function updateProfile() {
            const statusEl = document.getElementById('profile-status');
            const adminSection = document.getElementById('admin-section');
            const adminInputGroup = document.getElementById('admin-input-group');
            const addBtn = document.getElementById('add-admin-btn');
            
            if (isAdmin) {
                statusEl.textContent = isOwner ? '👑 Владелец' : '👑 Администратор';
                statusEl.className = 'value ' + (isOwner ? 'owner-badge' : 'admin-badge');
                adminSection.style.display = 'block';
                renderAdmins();
                
                if (isOwner) {
                    adminInputGroup.style.display = 'flex';
                    addBtn.disabled = false;
                } else {
                    adminInputGroup.style.display = 'none';
                    addBtn.disabled = true;
                }
            } else {
                statusEl.textContent = '👤 Пользователь';
                statusEl.className = 'value';
                adminSection.style.display = 'none';
            }
        }

        function renderAdmins() {
            const container = document.getElementById('admin-list');
            if (!admins || admins.length === 0) {
                container.innerHTML = '<div style="color:#8b949e;font-size:13px;padding:8px;">Нет администраторов</div>';
                return;
            }
            container.innerHTML = admins.map(id => {
                const isCurrent = Number(id) === Number(userId);
                const isOwnerUser = OWNER_IDS.includes(Number(id));
                const canRemove = isOwner && !isOwnerUser && !isCurrent;
                
                return `<div class="admin-item">
                    <div>
                        <span class="admin-name">${isOwnerUser ? '👑 ' : ''}${id}</span>
                        <span class="admin-id">${isCurrent ? '(Вы)' : ''}</span>
                        ${isOwnerUser ? '<span class="admin-owner-badge">(Владелец)</span>' : ''}
                    </div>
                    ${canRemove ? `<button class="remove-admin" onclick="removeAdmin(${id})">✕</button>` : ''}
                </div>`;
            }).join('');
        }

        function refreshAdminStatus() {
            loadAdminsFromServer();
            if (isAdmin) {
                if (tg) tg.showAlert('✅ Ваш статус обновлён! Вы администратор.');
            } else {
                if (tg) tg.showAlert('👤 Ваш статус: пользователь.');
            }
        }

        // ============================================================
        // УПРАВЛЕНИЕ АДМИНАМИ
        // ============================================================
        async function addAdmin() {
            if (!isOwner) {
                if (tg) tg.showAlert('Только владельцы могут добавлять администраторов');
                return;
            }
            
            const input = document.getElementById('admin-id-input');
            const id = input.value.trim();
            if (!id || isNaN(id)) {
                if (tg) tg.showAlert('Введите корректный ID пользователя');
                return;
            }
            const numId = Number(id);
            if (admins.includes(numId)) {
                if (tg) tg.showAlert('Этот пользователь уже администратор');
                return;
            }
            if (OWNER_IDS.includes(numId)) {
                if (tg) tg.showAlert('Этот пользователь уже владелец');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/add_admin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: numId,
                        init_data: initData
                    })
                });
                const data = await response.json();
                
                if (data.error) {
                    if (tg) tg.showAlert(`❌ Ошибка: ${data.error}`);
                    return;
                }
                
                await loadAdminsFromServer();
                renderAdmins();
                input.value = '';
                
                try {
                    await fetch(`${API_URL}/api/send_notification`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: numId,
                            message: `👑 *Вас добавили в администраторы!*\n\nВы теперь будете получать уведомления об удалении и редактировании сообщений.\n\nДобавил: ${userId || 'Неизвестный'}`,
                            init_data: initData
                        })
                    });
                } catch (e) {
                    console.error('Ошибка отправки уведомления:', e);
                }
                
                if (Number(numId) === Number(userId)) {
                    isAdmin = true;
                    await loadAdminsFromServer();
                    updateProfile();
                    if (tg) tg.showAlert('👑 Вы теперь администратор! Статус обновлён.');
                } else {
                    if (tg) tg.showAlert(`✅ Пользователь ${numId} добавлен как администратор\nЕму отправлено уведомление`);
                }
            } catch (e) {
                console.error('Ошибка добавления админа:', e);
                if (tg) tg.showAlert('❌ Ошибка добавления администратора');
            }
        }

        async function removeAdmin(id) {
            if (!isOwner) {
                if (tg) tg.showAlert('Только владельцы могут удалять администраторов');
                return;
            }
            if (Number(id) === Number(userId)) {
                if (tg) tg.showAlert('Вы не можете удалить себя из администраторов');
                return;
            }
            if (OWNER_IDS.includes(Number(id))) {
                if (tg) tg.showAlert('Нельзя удалить владельца');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/remove_admin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: id,
                        init_data: initData
                    })
                });
                const data = await response.json();
                
                if (data.error) {
                    if (tg) tg.showAlert(`❌ Ошибка: ${data.error}`);
                    return;
                }
                
                await loadAdminsFromServer();
                renderAdmins();
                
                if (Number(id) === Number(userId)) {
                    isAdmin = false;
                    await loadAdminsFromServer();
                    updateProfile();
                    if (tg) tg.showAlert('❌ Вас удалили из администраторов! Статус обновлён.');
                }
                
                try {
                    await fetch(`${API_URL}/api/send_notification`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: id,
                            message: `❌ *Вас удалили из администраторов*\n\nВы больше не будете получать уведомления об удалении и редактировании сообщений.\n\nУдалил: ${userId || 'Неизвестный'}`,
                            init_data: initData
                        })
                    });
                } catch (e) {
                    console.error('Ошибка отправки уведомления:', e);
                }
                
                if (tg) tg.showAlert(`✅ Администратор ${id} удалён`);
            } catch (e) {
                console.error('Ошибка удаления админа:', e);
                if (tg) tg.showAlert('❌ Ошибка удаления администратора');
            }
        }

        // ============================================================
        // АККАУНТЫ
        // ============================================================
        async function loadAccounts() {
            const container = document.getElementById('accounts-view');
            if (!container) return;
            container.innerHTML = '<div style="text-align:center;padding:20px;color:#8b949e;">Загрузка...</div>';
            try {
                const response = await fetch(`${API_URL}/api/all_accounts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ init_data: initData })
                });
                const data = await response.json();
                if (data.error) {
                    container.innerHTML = `<div class="empty-state"><p class="error">❌ ${data.error}</p></div>`;
                    return;
                }
                if (!data.accounts || data.accounts.length === 0) {
                    container.innerHTML = `<div class="empty-state"><div class="icon">🔗</div><div class="title">Нет аккаунтов</div><p style="font-size:13px;">Подключите бизнес-аккаунт через бота</p></div>`;
                    return;
                }
                accountsData = data.accounts;
                renderAccounts(accountsData);
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><p class="error">❌ Ошибка загрузки: ${e.message}</p></div>`;
            }
        }

        function renderAccounts(accounts) {
            const container = document.getElementById('accounts-view');
            container.innerHTML = accounts.map(acc => {
                const statusText = acc.is_enabled ? '🟢 Активен' : '🔴 Отключён';
                const statusClass = acc.is_enabled ? 'online' : 'offline';
                const name = acc.name || 'Аккаунт';
                const userInfo = acc.user_id ? `👤 Владелец: ${acc.user_id}` : '';
                
                let clickHandler = '';
                if (isAdmin) {
                    clickHandler = `onclick="loadAccountChats('${acc.id}', '${name}', '${acc.user_id || ''}')"`;
                }
                
                return `<div class="account-item" ${clickHandler} style="${isAdmin ? 'cursor:pointer;' : ''}">
                    <div class="account-avatar">${name.charAt(0).toUpperCase()}</div>
                    <div class="account-info">
                        <div class="account-name">${name}</div>
                        <div class="account-id">🔗 ID: ${acc.id}</div>
                        ${userInfo ? `<div class="account-user">${userInfo}</div>` : ''}
                        <div class="account-chats-count">📊 Подключён: ${acc.connected_at || '—'}</div>
                    </div>
                    <span class="account-status ${statusClass}">${statusText}</span>
                    ${isAdmin ? '<span style="font-size:11px;color:#5865f2;">👆 Нажмите</span>' : ''}
                </div>`;
            }).join('');
        }

        async function loadAccountChats(accountId, accountName, ownerId) {
            if (!isAdmin) {
                if (tg) tg.showAlert('Только администраторы могут просматривать чаты аккаунтов');
                return;
            }
            
            selectedAccountId = accountId;
            selectedAccountInfo = { id: accountId, name: accountName, owner: ownerId };
            
            const container = document.getElementById('account-chats-view');
            container.innerHTML = '<div style="text-align:center;padding:20px;color:#8b949e;">Загрузка чатов...</div>';
            container.style.display = 'block';
            document.getElementById('accounts-view').style.display = 'none';
            document.getElementById('header-title').textContent = `💬 Чаты аккаунта: ${accountName}`;
            
            try {
                const response = await fetch(`${API_URL}/api/chats`, {

            document.getElementById('header-title').textContent = '🔗 Аккаунты';

        // ============================================================
        // ПОДКЛЮЧЕНИЯ
        // ============================================================
        async function loadConnectionLogs() {
            try {
                const response = await fetch(`${API_URL}/api/connection_logs`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ init_data: initData })
                });
                const data = await response.json();
                if (data.error || !data.logs) {
                    connectionLogs = [];
                    renderConnectionLogs();
                    return;
                }
                connectionLogs = data.logs;
                renderConnectionLogs();
                checkWarnings();
            } catch (e) {
                console.error('Ошибка загрузки логов подключений:', e);
            }
        }

        function renderConnectionLogs() {
            const container = document.getElementById('connections-list');
            if (!container) return;
            if (connectionLogs.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><div class="title">Нет логов подключений</div><p style="font-size:13px;">История подключений будет отображаться здесь</p></div>`;
                return;
            }
            container.innerHTML = connectionLogs.map(log => {
                const time = log.timestamp ? new Date(log.timestamp).toLocaleString('ru-RU') : '';
                const actionText = log.action === 'connect' ? '🟢 Подключился' : '🔴 Отключился';
                const actionClass = log.action === 'connect' ? 'connect' : 'disconnect';
                const chatCount = log.chat_count ? `📊 ${log.chat_count} чатов` : '';
                const userDisplay = log.user_id || 'Неизвестно';
                return `<div class="conn-item ${actionClass}">
                    <span class="conn-time">${time}</span>
                    <span class="conn-user">👤 ${userDisplay}</span>
                    <span class="conn-action ${actionClass}">${actionText}</span>
                    <span class="conn-chats">${chatCount}</span>
                </div>`;
            }).join('');
        }

        function checkWarnings() {
            const banner = document.getElementById('warning-banner');
            const text = document.getElementById('warning-text');
            const now = Date.now();
            const recentDisconnects = connectionLogs.filter(log => {
                if (log.action !== 'disconnect') return false;
                const logTime = new Date(log.timestamp).getTime();
                return (now - logTime) < 24 * 60 * 60 * 1000;
            });
            if (recentDisconnects.length > 0) {
                const last = recentDisconnects[0];
                const time = new Date(last.timestamp).toLocaleString('ru-RU');
                text.textContent = `⚠️ Было обнаружено отключение бота ${time}. Возможна потеря сообщений (было чатов: ${last.chat_count || 0})`;
                banner.classList.add('visible');
            } else {
                banner.classList.remove('visible');
            }
        }

        function closeWarning() {
            document.getElementById('warning-banner').classList.remove('visible');
        }

        // ============================================================
        // ФИЛЬТРЫ ДЛЯ ЛОГОВ
        // ============================================================
        function setLogFilter(filter) {
            if (filter === 'all') {
                const allActive = logFilters.all;
                logFilters.all = !allActive;
                document.querySelectorAll('.filter-btn').forEach(b => {
                    if (b.dataset.filter !== 'all') {
                        b.classList.toggle('active', logFilters.all);
                        logFilters[b.dataset.filter] = logFilters.all;
                    }
                });
                document.querySelector('.filter-btn[data-filter="all"]').classList.toggle('active');
            } else {
                const btn = document.querySelector(`.filter-btn[data-filter="${filter}"]`);
                if (!btn) return;
                btn.classList.toggle('active');
                logFilters[filter] = btn.classList.contains('active');
                
                const allActive = document.querySelectorAll('.filter-btn:not([data-filter="all"])');
                const allChecked = Array.from(allActive).every(b => b.classList.contains('active'));
                document.querySelector('.filter-btn[data-filter="all"]').classList.toggle('active', allChecked);
                logFilters.all = allChecked;
            }
            applyLogFilters();
        }

        function applyLogFilters() {
            const showNormal = logFilters.normal;
            const showEdited = logFilters.edited;
            const showDeleted = logFilters.deleted;

            filteredLogs = allLogs.filter(log => {
                if (log.is_deleted && !showDeleted) return false;
                if (log.edited_at && log.original_text && !showEdited) return false;
                if (!log.is_deleted && !log.edited_at && !showNormal) return false;
                return true;
            });

            renderLogs();
        }

        // ============================================================
        // ЛОГИ
        // ============================================================
        async function loadAllLogs() {
            try {
                const response = await fetch(`${API_URL}/api/all_messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ init_data: initData })
                });
                const data = await response.json();
                if (data.error || !data.messages || data.messages.length === 0) {
                    allLogs = [];
                    filteredLogs = [];
                    renderLogs();
                    return;
                }
                allLogs = data.messages;
                applyLogFilters();
            } catch (e) { console.error(e); }
        }

        function renderLogs() {
            const container = document.getElementById('logs-list');
            if (!container) return;
            if (filteredLogs.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><div class="title">Нет логов</div><p style="font-size:13px;">Сообщения появятся после подключения бота</p></div>`;
                return;
            }
            container.innerHTML = filteredLogs.map(log => {
                const time = log.sent_at ? new Date(log.sent_at).toLocaleString('ru-RU') : '';
                const sender = log.from_user_name || 'Неизвестный';
                let text = log.text_content || '(без текста)';
                let typeClass = 'normal';
                let icon = '';
                let originalText = '';
                if (log.is_deleted) {
                    typeClass = 'deleted';
                    icon = '🗑️';
                    text = log.original_text || log.text_content || '(удалено)';
                } else if (log.edited_at && log.original_text && log.original_text !== log.text_content) {
                    typeClass = 'edited';
                    icon = '➡️';
                    originalText = log.original_text;
                }
                return `<div class="log-item ${typeClass}" onclick="openChat('${log.chat_id}', 'Чат')">
                    <span class="log-time">${time}</span>
                    <span class="log-sender">${sender}</span>
                    <span class="log-text">${typeClass === 'edited' ? `<span style="color:#8b949e;text-decoration:line-through;">${originalText}</span> → ` : ''}${text}</span>
                    ${icon ? `<span class="log-icon ${typeClass}-icon">${icon}</span>` : ''}
                </div>`;
            }).join('');
        }

        // ============================================================
        // ЧАТЫ
        // ============================================================
        function getVisibleChats() {
            if (trashMode) {
                return allChats.filter(chat => trashChats.has(chat.chat_id));
            }
            return allChats.filter(chat => !trashChats.has(chat.chat_id));
        }

        async function loadChats() {
            const container = document.getElementById('chats-list');
            container.innerHTML = '<div style="text-align:center;padding:20px;color:#8b949e;">Загрузка...</div>';
            try {
                const requestData = { init_data: initData };
                if (selectedAccountId && selectedAccountId !== 'default') {
                    requestData.account_id = selectedAccountId;
                }
                const response = await fetch(`${API_URL}/api/chats`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                });
                const data = await response.json();
                if (data.error) {
                    container.innerHTML = `<div class="empty-state"><p class="error">❌ ${data.error}</p></div>`;
                    document.getElementById('chats-count').textContent = '0';
                    return;
                }
                if (!data.chats || data.chats.length === 0) {
                    container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><div class="title">${trashMode ? 'Корзина пуста' : 'Нет чатов'}</div><p style="font-size:13px;">${trashMode ? 'Здесь будут удалённые чаты' : 'Переписки появятся после подключения бота'}</p></div>`;
                    document.getElementById('chats-count').textContent = '0';
                    return;
                }
                allChats = data.chats;
                const visibleChats = getVisibleChats();
                document.getElementById('chats-count').textContent = visibleChats.length;
                renderChats(visibleChats);
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><p class="error">❌ Ошибка загрузки: ${e.message}</p></div>`;
            }
        }

        function renderChats(chats) {
            const container = document.getElementById('chats-list');
            const sorted = [...chats].sort((a, b) => {
                const aPinned = pinnedChats.has(a.chat_id) ? 1 : 0;
                const bPinned = pinnedChats.has(b.chat_id) ? 1 : 0;
                return bPinned - aPinned;
            });
            container.innerHTML = sorted.map(chat => {
                const isPinned = pinnedChats.has(chat.chat_id);
                const isSelected = selectedChats.has(chat.chat_id);
                const displayName = chat.other_party_name || chat.name || 'Чат';
                let statusIcon = isPinned ? '📌' : '';

                    checkboxHtml = `<div class="checkbox ${isSelected ? 'checked' : ''}" onclick="event.stopPropagation(); toggleSelectChat(${chat.chat_id})"></div>`;
                }
                const contextAttr = trashMode ? '' : `oncontextmenu="showContextMenu(event, ${chat.chat_id})"`;
                return `<div class="chat-item ${isPinned ? 'pinned' : ''}" data-chat-id="${chat.chat_id}" onclick="${trashMode ? '' : `openChat('${chat.chat_id}', '${displayName}')`}" ${contextAttr}>

                    <div class="avatar">${(displayName || 'Ч').charAt(0).toUpperCase()}</div>
                    <div class="info">
                        <div class="name">${displayName} ${statusIcon}</div>
                        <div class="last-msg">${chat.last_message || 'Нет сообщений'}</div>
                        <div class="stats-badge">
                            <span class="deleted-count">🗑️ ${chat.deleted || 0}</span>
                            <span class="edited-count">✏️ ${chat.edited || 0}</span>
                        </div>
                    </div>
                    <div class="time">${chat.last_time || ''}</div>
                </div>`;

        function refreshAll() {
            if (currentTab === 'logs') {
                loadAllLogs();
            } else if (currentTab === 'chats') {
                loadChats();
            } else if (currentTab === 'connections') {

        // ============================================================
        // КОРЗИНА
        // ============================================================
        function toggleTrashMode() {
            trashMode = !trashMode;
            selectedChats.clear();
            selectMode = false;
            document.getElementById('select-mode-btn').textContent = '☐ Выбрать';
            document.getElementById('select-mode-btn').classList.remove('active');
            document.getElementById('delete-selected-btn').style.display = 'none';
            const banner = document.getElementById('trash-banner');
            if (trashMode) {

                document.getElementById('trash-btn').style.color = '#f85149';

                document.getElementById('trash-btn').style.color = '#8b949e';

        function toggleSelectMode() {
            selectMode = !selectMode;
            selectedChats.clear();
            const btn = document.getElementById('select-mode-btn');
            const deleteBtn = document.getElementById('delete-selected-btn');
            if (selectMode) {
                btn.textContent = '☑ Отменить';
                btn.classList.add('active');
                deleteBtn.style.display = 'inline-block';

                deleteBtn.style.display = 'none';

        function toggleSelectChat(chatId) {
            if (!selectMode) return;
            if (selectedChats.has(chatId)) {
                selectedChats.delete(chatId);
            } else {
                selectedChats.add(chatId);
            }
            renderChats(getVisibleChats());
        }

        function deleteSelectedFromTrash() {
            if (selectedChats.size === 0) {
                if (tg) tg.showAlert('Выберите чаты для удаления');
                return;
            }
            const confirmMsg = `Удалить ${selectedChats.size} чат(ов) навсегда?`;
            const doDelete = async () => {
                const ids = Array.from(selectedChats);
                let success = 0;
                for (const chatId of ids) {
                    try {
                        const response = await fetch(`${API_URL}/api/delete_chat`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: chatId,
                                account_id: selectedAccountId,
                                init_data: initData
                            })
                        });
                        const data = await response.json();
                        if (data.success) {
                            trashChats.delete(chatId);
                            pinnedChats.delete(chatId);
                            success++;
                        }
                    } catch (e) { console.error(e); }
                }
                selectedChats.clear();
                saveTrashChats();
                savePinnedChats();
                loadChats();
                if (tg) tg.showAlert(`✅ Удалено ${success} чат(ов)`);
            };
            if (tg) {
                tg.showPopup({
                    title: 'Удалить чаты?',
                    message: confirmMsg,
                    buttons: [{ type: 'cancel', text: 'Отмена' }, { type: 'ok', text: 'Удалить', style: 'danger' }]
                }, (buttonId) => { if (buttonId === 'ok') doDelete(); });
            } else {
                if (confirm(confirmMsg)) doDelete();
            }
        }

        function clearAllTrash() {
            const count = getVisibleChats().length;
            if (count === 0) {
                if (tg) tg.showAlert('Корзина пуста');
                return;
            }
            const confirmMsg = `Удалить ${count} чат(ов) из корзины навсегда?`;
            const doClear = async () => {
                const chats = getVisibleChats();
                let success = 0;
                for (const chat of chats) {
                    try {
                        const response = await fetch(`${API_URL}/api/delete_chat`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: chat.chat_id,
                                account_id: selectedAccountId,
                                init_data: initData
                            })
                        });
                        const data = await response.json();
                        if (data.success) {
                            trashChats.delete(chat.chat_id);
                            pinnedChats.delete(chat.chat_id);
                            success++;
                        }
                    } catch (e) { console.error(e); }
                }
                selectedChats.clear();
                saveTrashChats();
                savePinnedChats();
                loadChats();
                if (tg) tg.showAlert(`✅ Очищено ${success} чат(ов)`);
            };
            if (tg) {
                tg.showPopup({
                    title: 'Очистить корзину?',
                    message: confirmMsg,
                    buttons: [{ type: 'cancel', text: 'Отмена' }, { type: 'ok', text: 'Очистить всё', style: 'danger' }]
                }, (buttonId) => { if (buttonId === 'ok') doClear(); });
            } else {
                if (confirm(confirmMsg)) doClear();
            }
        }

        // ============================================================
        // КОНТЕКСТНОЕ МЕНЮ
        // ============================================================
        function showContextMenu(e, chatId) {
            e.preventDefault();
            e.stopPropagation();
            if (trashMode) return;
            contextChatId = chatId;
            const menu = document.getElementById('context-menu');
            const isPinned = pinnedChats.has(chatId);
            document.getElementById('pin-btn').style.display = isPinned ? 'none' : 'block';
            document.getElementById('unpin-btn').style.display = isPinned ? 'block' : 'none';
            menu.style.display = 'block';
            menu.style.left = Math.min(e.clientX, window.innerWidth - 200) + 'px';
            menu.style.top = Math.min(e.clientY, window.innerHeight - 120) + 'px';
        }

        function hideContextMenu() {
            document.getElementById('context-menu').style.display = 'none';
            contextChatId = null;
        }

        function pinChat() {
            if (contextChatId) {
                pinnedChats.add(contextChatId);
                savePinnedChats();
                hideContextMenu();
                loadChats();
            }
        }

        function unpinChat() {
            if (contextChatId) {
                pinnedChats.delete(contextChatId);
                savePinnedChats();
                hideContextMenu();
                loadChats();
            }
        }

                    try {
                        const response = await fetch(`${API_URL}/api/delete_chat`, {

                                account_id: selectedAccountId,
                                init_data: initData
                            })
                        });
                        const data = await response.json();
                        if (data.success) {
